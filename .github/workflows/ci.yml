# This workflow builds a Java Maven project and deploys jar + config to EC2.
# 환경(test/production) 분리는 하지 않음 → 저장소 루트 environment.md 참고
# SSH: ec2-user + PEM 키(GitHub Secrets EC2_SSH_KEY)
# systemd 유닛(demo-ci.service)은 EC2 에 이미 있다고 가정

name: Java CI/CD with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  # main 에 push 될 때만 EC2 배포
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifacts

      - name: Prepare files to copy
        run: |
          set -euo pipefail
          mkdir -p release
          JAR="$(find artifacts -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          cp "${JAR}" release/app.jar
          cp deploy/application.yml release/application.yml
          cp deploy/env.conf release/env.conf
          ls -la release

      # 로컬 예: scp -i key.pem release/* ec2-user@{IP}:~/demo-ci/
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "release/*"
          target: ~/demo-ci
          strip_components: 1

      - name: Install files and restart systemd
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/demo-ci/current /opt/demo-ci/conf
            sudo cp ~/demo-ci/app.jar /opt/demo-ci/current/app.jar
            sudo cp ~/demo-ci/application.yml /opt/demo-ci/current/application.yml
            sudo cp ~/demo-ci/env.conf /opt/demo-ci/conf/env.conf
            sudo chown -R ec2-user:ec2-user /opt/demo-ci
            sudo systemctl restart demo-ci.service
            sudo systemctl --no-pager --full status demo-ci.service || true
